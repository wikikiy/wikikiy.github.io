</head>
<body>
    <!-- Header -->
    <header class="header" role="banner">
        <div class="header-inner">
            <a href="#" class="logo" id="logoHome" aria-label="袋书首页">
                <!--
                <span class="logo-icon">📖</span>
                -->
                <span class="logo-text">袋书</span>
            </a>
            <nav class="header-actions" role="navigation" aria-label="工具栏">
                <button id="themeToggle" class="btn btn-icon" aria-label="切换深浅色模式" title="切换深浅色模式">
                    <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
                    </svg>
                </button>
                <button id="clearBtn" class="btn btn-icon" aria-label="清除电子书" title="清除电子书" disabled>
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
                    </svg>
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main" role="main">
        <!-- Home / Bookshelf Area -->
        <section id="homeArea" class="home-area">
            <!-- Compact Upload Bar -->
            <div class="upload-bar">
                <div class="upload-bar-content">
                    <div class="upload-bar-icon">📤</div>
                    <div class="upload-bar-text">
                        <strong>上传电子书</strong>
                        <span class="upload-bar-hint">支持 EPUB、MOBI、AZW3、PDF、TXT</span>
                    </div>
                    <div class="upload-dropzone-inline" id="dropzoneInline">
                        <input type="file" id="fileInput" accept=".epub,.txt,.mobi,.azw3,.pdf" hidden multiple>
                        <label for="fileInput" class="btn btn-primary">选择文件</label>
                        <span class="upload-inline-hint">或拖拽到此处</span>
                    </div>
                </div>
            </div>

            <!-- Bookshelf -->
            <div class="bookshelf">
                <h2 class="bookshelf-title">我的书架</h2>
                <div class="bookshelf-grid" id="bookshelfGrid"></div>
            </div>

            <div class="upload-card-compact" id="uploadCardCompact" style="display:none">
                <div class="upload-dropzone" id="dropzone">
                    <label for="fileInput" class="upload-label">
                        <span>点击选择更多文件</span>
                        <span class="upload-hint">或将电子书拖拽到此处</span>
                    </label>
                </div>
            </div>
        </section>

        <!-- Reader Area -->
        <section id="readerArea" class="reader-area" style="display:none">
            <!-- Sidebar with TOC -->
            <aside class="sidebar" id="sidebar" role="navigation" aria-label="章节导航">
                <div class="sidebar-header">
                    <button id="backBtn" class="btn btn-back" aria-label="返回首页" title="返回首页">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="15 18 9 12 15 6"/>
                        </svg>
                        <span>返回</span>
                    </button>
                    <h2 class="sidebar-title" id="bookTitle">目录</h2>
                </div>
                <nav class="toc-list" id="tocList" role="list"></nav>
            </aside>

            <!-- Content Area -->
            <div class="content-area">
                <div class="content-wrapper" id="contentWrapper">
                    <article class="content-scroll" id="contentScroll" role="article">
                        <div class="content-body" id="contentBody"></div>
                    </article>
                    <button class="scroll-top-btn" id="scrollTopBtn" aria-label="返回顶部" title="返回顶部">
                        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="18 15 12 9 6 15"/>
                        </svg>
                    </button>
                </div>

                <!-- Bottom Navigation -->
                <nav class="bottom-nav" role="navigation" aria-label="翻页">
                    <button id="prevBtn" class="btn btn-nav" aria-label="上一页">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="15 18 9 12 15 6"/>
                        </svg>
                        <span>上一页</span>
                    </button>
                    <button id="ttsToggle" class="btn btn-tts" aria-label="听书" title="听书" disabled>
                        <svg class="icon-play" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="5 3 19 12 5 21 5 3"/>
                        </svg>
                        <svg class="icon-pause" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                            <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
                        </svg>
                        <span>听书</span>
                    </button>
                    <button id="nextBtn" class="btn btn-nav" aria-label="下一页">
                        <span>下一页</span>
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"/>
                        </svg>
                    </button>
                </nav>
            </div>
        </section>
    </main>

    <!-- Toast -->
    <div class="toast" id="toast" role="alert" aria-live="polite"></div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay" style="display:none" role="status" aria-label="加载中">
